name: tourism_ui
description: Flutter UI built from the user's Stitch screens m1-m10.
publish_to: none
version: 0.1.0
environment:
  sdk: ^3.13.5
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/PlusJakartaSans-OFL.txt
    - assets/fonts/PlayfairDisplay-OFL.txt
  fonts:
    - family: Jakarta
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
    - family: Playfair
      fonts:
        - asset: assets/fonts/PlayfairDisplay.ttf
